name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OWNd explicitly
        run: pip install OWNd==0.7.49
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2025.1.0
          pip install pytest>=8.3 pytest-asyncio>=0.23 ruff>=0.12 mypy>=1.17
      - name: Run pytest
        run: python -m pytest
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy
