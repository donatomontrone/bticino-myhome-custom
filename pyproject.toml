[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bticino-myhome-mh201"
version = "0.1.5"
description = "BTicino MyHome MH201 integration for Home Assistant"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Donato Montrone", email = "114031046+donatomontrone@users.noreply.github.com"}
]
keywords = ["home-assistant", "bticino", "myhome", "openwebnet", "mh201"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.8",
    "homeassistant>=2025.1.0",
    "OWNd>=0.7.49",
]

[tool.setuptools]
packages = ["custom_components.bticino_myhome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = [
    "custom_components/bticino_myhome/**/*.py",
    "tests/**/*.py",
]
exclude = [
    "custom_components/bticino_myhome/__pycache__",
]
